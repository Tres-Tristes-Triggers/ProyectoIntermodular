name: proyecto-intermodular
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    container_name: pi-postgres
    environment:
      POSTGRES_DB: turnos_db
      POSTGRES_USER: turnos_user
      POSTGRES_PASSWORD: turnos_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: